[project]
name = "dreamer-reactor-app"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "setuptools",
    "numpy<2",
    # 0.5.x adds working Blackwell (sm_100 / B200) codegen; 0.4.x aborts on a
    # bf16->f16 conversion during XLA compilation there. flax 0.10 / orbax 0.11
    # both accept 0.5.x (jax>=0.4.27 / >=0.4.34, no upper bound).
    "jax[cuda12]>=0.5.3,<0.6",
    "flax>=0.10.0,<0.11",
    # Pinned: orbax >= 0.11.6 calls jax.monitoring.record_scalar, which jax
    # 0.5.3 removed. 0.11.5 is the last release compatible with this jax.
    "orbax-checkpoint==0.11.5",
    "optax>=0.2.4,<0.3",
    "hydra-core>=1.3.2,<1.4",
    "imageio[ffmpeg]>=2.31",
    "einops>=0.8.0,<0.9",
    "gym>=0.23.1,<0.24",
    "opencv-python-headless>=4.1.0.25",
    "Pillow>=8.0.0",
    "tqdm>=4.32.2",
    "requests>=2.20.0",
    "ipython>=7.5.0",
    "lxml>=4.3.3",
    "psutil>=5.6.2",
    "Pyro4>=4.76",
    "getch>=1.0",
    "coloredlogs>=10.0",
    "dill>=0.3.1.1",
    "daemoniker>=0.2.3",
    "xmltodict==0.12.0",
    "inflection>=0.3.1",
    "jinja2>=2.11.2",
    "imagehash>=4.0.0",
    "flaky",
    "pyglet",
]
