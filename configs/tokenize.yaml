defaults:
  - dataset: minecraft_vpt
  - _self_

tokenizer_ckpt: logs/tokenizer-asymmetric-repro/checkpoints        # Required: path to pretrained tokenizer checkpoint
output_dir: /mnt/data/big_tokenized_data            # Required: output directory for latent shards
dataset:
  dataloader_cfg:
    B: 2
    num_workers: 16
    short_T: 0
    long_T: 0
    long_ratio: 0.0
records_per_shard: 1000
num_shards: 500           # null = all shards
seed: 0
parallel_strategy: data

hydra:
  run:
    dir: .
