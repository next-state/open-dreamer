defaults:
  - common
  - _self_

run_name: tokenizer
ckpt_max_to_keep: 1
ckpt_save_every: 10_000

patch_size: 8

dataset:
  source: custom
  array_record_path: datasets/coinrun_hard_agent_episodes/train
  B: 64
  T: 64
  H: 64
  W: 64
  C: 3

encoder:
  n_latents: 16
  d_bottleneck: 16
  d_model: 512
  n_heads: 8
  n_kv_heads: 2
  depth: 4
  dropout_rate: 0.05
  qk_norm_type: quest  # options: qknorm, quest, null
  rope_theta: 10000.0
  time_every: 4
  mae_p_min: 0.0
  mae_p_max: 0.9
  patch_size: ${patch_size}
  dtype: ${dtype}
  param_dtype: ${param_dtype}
  
  dataset_mean: ${dataset.dataset_mean}
  dataset_std: ${dataset.dataset_std}

decoder:
  d_bottleneck: ${encoder.d_bottleneck}
  d_model: ${encoder.d_model}
  n_heads: ${encoder.n_heads}
  n_kv_heads: ${encoder.n_kv_heads}
  n_latents: ${encoder.n_latents}
  depth: ${encoder.depth}
  dropout_rate: ${encoder.dropout_rate}
  qk_norm_type: ${encoder.qk_norm_type}
  rope_theta: ${encoder.rope_theta}
  time_every: ${encoder.time_every}
  H: ${dataset.H}
  W: ${dataset.W}
  patch_size: ${patch_size}
  d_patch: ${mul:${patch_size},${patch_size},${dataset.C}}
  dtype: ${dtype}
  param_dtype: ${param_dtype}
  
  dataset_mean: ${dataset.dataset_mean}
  dataset_std: ${dataset.dataset_std}

max_steps: 300_000
log_every: 100
lr: 6e-4  # FIXME: consolidate with max_lr
tokenizer_loss_type: "mse" # "mse" | "mae"

# learning rate schedule
lr_schedule: wsd  # constant | wsd | cos
init_lr: 0.0
max_lr: 6e-4
lr_end: 0
warmup_steps: 10000
wsd_decay_steps: 30000
log_gradients: false

lpips_weight: 0.2
lpips_frac: 0.5
visualize_every: 1000