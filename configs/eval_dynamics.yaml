defaults:
  - dataset: minecraft_vpt_latent   # override with e.g. dataset=coinrun
  - _self_

dynamics_ckpt: logs/dynamics-stable-big-latents/checkpoints          # Required: path to DynamicsCheckpointBundle checkpoint dir

run_name: eval_dynamics
use_wandb: false
parallel_strategy: data
model_axis_size: 1
seed: 0

dataset:
  dataloader_cfg:
    B: 8                    # Number of sequences to sample
    short_T: 256
    long_T: 256

# Evaluation settings
output_dir: eval_outputs    # Where to save videos / PNGs
step: 0                     # Step label stamped on output filenames

hydra:
  run:
    dir: ${output_dir}
