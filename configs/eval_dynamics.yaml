defaults:
  - dataset: minecraft_vpt_latent   # override with e.g. dataset=coinrun
  - _self_

dynamics_ckpt: gatto          # Required: path to DynamicsCheckpointBundle checkpoint dir

run_name: eval_dynamics
use_wandb: false
parallel_strategy: data
seed: 700

dataset:
  dataloader_cfg:
    B: 1                    # Number of sequences to sample
    short_T: 256
    long_T: 256

# Evaluation settings
output_dir: eval_outputs    # Where to save videos / PNGs
step: 0                     # Step label stamped on output filenames

hydra:
  run:
    dir: ${output_dir}
