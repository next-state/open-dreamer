defaults:
  - dataset: minecraft_vpt_latent   # override with e.g. dataset=coinrun
  - _self_

dynamics_ckpt: ???          # Required: path to DynamicsCheckpointBundle checkpoint dir

run_name: eval_dynamics
use_wandb: false
parallel_strategy: data
seed: 0
dataset_seed: null         # null -> reuse seed for dataset sampling

dataset:
  dataloader_cfg:
    B: 4                    # Number of sequences to sample
    short_T: 32
    long_T: 32

# Evaluation settings
output_dir: eval_outputs    # Where to save videos / PNGs
step: 0                     # Step label stamped on output filenames
eval_prompt_length: 4       # Number of observed prompt frames for eval; null/128 uses the model attention window as the default
eval_rollout_tags: [ema_shortcut]
eval_shortcut_steps: 4
history_guidance_mode: off
history_guidance_scale: 0.0
history_guidance_tau_target: 0.5

hydra:
  run:
    dir: ${output_dir}
