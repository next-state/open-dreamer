defaults:
  - _self_

# Random seed
seed: 0

# Checkpointing
ckpt:
  max_to_keep: 2
  save_interval_steps: 10_000

# WandB
use_wandb: False
wandb_entity: Null
wandb_project: tiny_dreamer_4

# Precision
dtype: bfloat16
param_dtype: float32

# Parallel
parallel_strategy: data  # data | fsdp | tp

# Hydra
hydra:
  run:
    dir: logs/${run_name}
