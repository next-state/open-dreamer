defaults:
  - _self_

run_name: ???
use_wandb: false
dataset: ???

# Checkpointing
ckpt:
  max_to_keep: 2
  save_interval_steps: 10_000
  max_steps: ${max_steps}

# Logging
logger:
  run_name: ${run_name}
  use_wandb: ${use_wandb}
  wandb_entity: Null
  wandb_project: tiny_dreamer_4
  log_every: 100
  max_steps: ${max_steps}
  log_gradients: false

# Precision
dtype: bfloat16
param_dtype: float32

# Mu-Parameterization (muP)
# Enable for hyperparameter transfer across model widths
mup:
  enabled: false
  base_width: 256  # Reference width for LR scaling
  attn_scale_type: mup  # mup = 1/d_head, standard = 1/sqrt(d_head)

# Parallel
parallel_strategy: data  # data | fsdp | tp

# Random seed
seed: 0

# Hydra
hydra:
  run:
    dir: logs/${run_name}
