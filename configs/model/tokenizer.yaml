patch_size: 4

encoder:
  n_latents: 16
  d_bottleneck: 32
  d_model: 64
  n_heads: 4
  n_kv_heads: 2
  depth: 8
  dropout_rate: 0.05
  qk_norm_type: null  # options: qknorm, quest, null
  use_rope: true
  rope_theta: 10000.0
  time_every: 4
  mae_p_min: 0.0
  mae_p_max: 0.9

decoder:
  n_latents: ${model.encoder.n_latents}
  d_model: ${model.encoder.d_model}
  n_heads: ${model.encoder.n_heads}
  n_kv_heads: ${model.encoder.n_kv_heads}
  depth: ${model.encoder.depth}
  dropout_rate: ${model.encoder.dropout_rate}
  qk_norm_type: ${model.encoder.qk_norm_type}
  use_rope: ${model.encoder.use_rope}
  rope_theta: ${model.encoder.rope_theta}
  time_every: ${model.encoder.time_every}