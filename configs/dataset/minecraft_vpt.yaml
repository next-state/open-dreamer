defaults:
  - _self_

name: minecraft_vpt
data_type: video

array_record_path: /alloc/data/arrayrecords-mp4
index_max: 1500
num_max_samples: -1

dataloader_cfg:
  B: 8
  num_workers: 4
  prefetch_buffer_size: 3
  device_prefetch_buffer_size: 1
  short_T: ???
  long_T: ???
  long_ratio: 0.1
  start_step: 0
  dtype: bfloat16

H: 360
W: 640
C: 3

padding_H: [4, 4]
padding_W: [0, 0]
patch_size: 16

num_binary_actions: 27  # keyboard + mouse buttons + wheel direction
categorical_action_dim: 121  # mouse actions
continuous_action_dim: 0

dataset_mean: [0.2241, 0.2348, 0.2086]
dataset_std: [0.1809, 0.1874, 0.2282]

p_include_reward: 0.0
