# Tokenized Minecraft/VPT latent ArrayRecord dataset.
# Produced by `scripts/tokenize_minecraft_dataset.py` from the raw MP4 dataset.

defaults:
  - _self_

# Dataset name used by logs and config composition.
name: minecraft_vpt_latent

# Latent mode. The iterator reads msgpack records with tokenizer latents instead
# of decoding raw MP4 bytes.
data_type: latent

# Directory containing tokenized shards named `shard-00000.array_record`,
# `shard-00001.array_record`, and so on.
array_record_path: /alloc/data/tokenized_data_500M

# Number of contiguous latent shards to load. Set this to the actual shard count
# written by tokenization; it is not a video count.
index_max: 89

# Optional cap on records exposed to the sampler. `-1` means all records from the
# selected latent shards.
num_max_samples: -1

# Action dimensions must match the raw dataset and the dynamics model.
num_binary_actions: 27
categorical_action_dim: 121
continuous_action_dim: 0

# Must match the representation used during tokenization. Valid values are
# `categorical` and `continuous`.
mouse_repr: categorical

dataloader_cfg:
  # Global batch size across all JAX processes. Dynamics configs normally set
  # this value. It must be divisible by `jax.process_count()`.
  B: ???

  # Grain workers used for latent record loading and slicing.
  num_workers: 16

  # Host-side prefetch depth. Latent records are cheaper than MP4 decoding, so a
  # deeper buffer is usually practical.
  prefetch_buffer_size: 10

  # Device-side prefetch depth. Increase only if memory allows.
  device_prefetch_buffer_size: 1

  # Short sequence length for dynamics training. In the dual iterator, short
  # examples are packed into `long_T` batches with block-causal masks.
  short_T: ???

  # Long sequence length for dynamics training and evaluation. Every selected
  # latent record must contain at least this many timesteps.
  long_T: ???

  # Fraction of dual-iterator batches sampled as true `long_T` episodes. The
  # rest are packed from `short_T` chunks. Must be in [0, 1].
  long_ratio: ???

  # Reserved for resumed or curriculum dataloader schedules. The current
  # iterator does not use this field directly.
  start_step: 0

  # Batch dtype after preprocessing.
  dtype: bfloat16

# Original raw frame height. Kept for tokenizer/dynamics metadata and decoding.
H: 360

# Original raw frame width.
W: 640

# Latent channel width (`d_bottleneck`) produced by the tokenizer. Must match the
# tokenizer checkpoint and the length of `latent_mean` / `latent_std`.
C: 16

# Pixel normalization stats from the raw dataset. Required when decoding latents
# back to frames for videos and metrics.
dataset_mean: [0.2241, 0.2348, 0.2086]
dataset_std: [0.1809, 0.1874, 0.2282]

# Per-channel latent mean generated by tokenization at
# `metadata/latent_stats.npz`. Length must equal tokenizer `d_bottleneck`.
latent_mean: [-0.01275550201535225, -0.04425295069813728, 0.08248031884431839, 0.042714960873126984, 0.008957703597843647, -0.0018820130499079823, -0.012893370352685452, -0.08244539052248001, 0.011176219210028648, -0.09440866857767105, -0.05825792998075485, -0.0497550331056118, -0.0025538108311593533, 0.04231492802500725, -0.06914764642715454, 0.07559845596551895]

# Per-channel latent standard deviation generated by tokenization. Values must
# be positive and aligned with `latent_mean`.
latent_std:  [0.0848616436123848, 0.09066474437713623, 0.10068009793758392, 0.09407731145620346, 0.1937398761510849, 0.08929944783449173, 0.0907244011759758, 0.10503409057855606, 0.1614910215139389, 0.1081596165895462, 0.15006859600543976, 0.12637652456760406, 0.0923914909362793, 0.10154268890619278, 0.10797301679849625, 0.10930383950471878]
