defaults:
  - _self_

name: coinrun

array_record_path: datasets/coinrun_episodes/train
num_max_samples: -1

dataloader_cfg:
  B: 32
  T: 32
  num_workers: 4
  prefetch_buffer_size: 10
  device_prefetch_buffer_size: 1
  start_step: 0
  dtype: bfloat16

H: 64
W: 64
C: 3

padding_H: [0, 0]
padding_W: [0, 0]
patch_size: 8

num_binary_actions: 0
categorical_action_dim: 16  # keyboard actions # TODO: do binary as convention, so that game can be played in reactor frontend
continuous_action_dim: 0

dataset_mean: [0.5, 0.5, 0.5]
dataset_std: [0.288675, 0.288675, 0.288675]

p_include_reward: 0.5
data_type: video