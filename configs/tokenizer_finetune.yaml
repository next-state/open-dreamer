defaults:
  - tokenizer
  - _self_

max_steps: 30_000

dataset:
  dataloader_cfg:
    B: 2
    short_T: 32
    long_T: 128
    num_workers: 32
    
# Freeze encoder, linearly reduce masking from 0.9 → 0.0
freeze_encoder: false
mae_finetune: true
mae_finetune_p_max_start: 0.9
mae_finetune_p_max_end: 0.0
lpips_weight: 0.02

# Lower LR for finetuning
lr_schedule:
  lr: 6e-4
  warmup_ratio: 0.05
  decay_ratio: 0.8
  max_steps: ${max_steps}

ckpt:
  save_interval_steps: 1000
