program: scripts/train_tokenizer.py
method: random

metric:
  name: train/psnr
  goal: maximize

parameters:
  patch_size:
    values: [4, 8]

  encoder.n_latents:
    values: [16, 32]
  
  encoder.d_model:
    values: [128, 256, 512]

  encoder.depth:
    values: [4, 8, 12]

  encoder.dropout_rate:
    values: [0.05, 0.1]

  encoder.qk_norm_type:
    values: [null, qknorm, quest]

  encoder.rope_theta:
    values: [10000.0, 150000.0]

  use_wandb:
    value: true

  max_steps:
    value: 50000

command:
  - uv
  - run
  - ${program}
  - ${args_no_hyphens}
  - run_name=tok_patch${patch_size}_n_latents${encoder.n_latents}_d_model${encoder.d_model}_depth${encoder.depth}_dropout${encoder.dropout_rate}_qk_norm${encoder.qk_norm_type}_rope_theta${encoder.rope_theta}