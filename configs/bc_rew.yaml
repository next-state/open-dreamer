defaults:
  - common
  - _self_

run_name: bc_rew
tokenizer_ckpt: "logs/tokenizer/checkpoints"
dynamics_ckpt: "logs/dynamics/checkpoints"
ckpt_save_every: 100_000

dataset:
  B: 64
  diversify_data: true

action_dim: 4

patch: 4
enc_n_latents: 16
enc_d_bottleneck: 32
d_model_enc: 64
d_model_dyn: 128
enc_depth: 8
dec_depth: 8
dyn_depth: 8
n_heads: 4
n_kv_heads: 2
qk_norm_type: null  # options: qknorm, quest, null
use_rope: true
rope_theta: 10000.0
packing_factor: 2
n_register: 4
n_agent: 1
agent_space_mode: wm_agent

k_max: 8
bootstrap_start: 5000
self_fraction: 0.25

max_steps: 1_000_000_000
log_every: 500
lr: 1e-4

write_video_every: 100_000

L: 2
num_reward_bins: 101
reward_log_low: -3.0
reward_log_high: 3.0
n_tasks: 128
use_task_ids: true

loss_weight_shortcut: 1.0
loss_weight_policy: 0.3
loss_weight_reward: 0.3