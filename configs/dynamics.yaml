defaults:
    - common
    - _self_

run_name: dynamics
tokenizer_ckpt: logs/t-demo2-bf16-fp32/checkpoints/
ckpt_save_every: 25000

# Dynamics specific
dynamics:
    d_model: 512
    d_bottleneck: 64
    action_dim: 16
    depth: 12
    n_heads: 8
    n_kv_heads: 2
    packing_factor: 2
    n_register: 32
    qk_norm_type: quest
    rope_theta: 10000.0
    time_every: 4
    mlp_ratio: 4
    dropout_rate: 0.05
    k_max: 128
    dtype: ${dtype}
    param_dtype: ${param_dtype}

bootstrap_start: 5_000
self_fraction: 0.25
batch_size: 1024

max_steps: 300_000
log_every: 100
lr: 1e-4

# learning rate schedule
lr_schedule: wsd  # constant | wsd | cos
init_lr: 0.0
max_lr: 3e-4
lr_end: 0
warmup_steps: 50000
wsd_decay_steps: 20000

write_video_every: 50000
