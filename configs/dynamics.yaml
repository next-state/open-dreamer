defaults:
  - common
  - dataset: minecraft_vpt
  - _self_

run_name: dynamics-high-lr

ckpt:
  max_to_keep: 1
  save_interval_steps: 1_000

dataset:
  dataloader_cfg:
    B: 32
    T: 32

dynamics:
    d_bottleneck: 16
    depth: 16
    d_model: ${mul:64,${dynamics.depth}}
    n_heads: ${floordiv:${dynamics.d_model},64}
    n_kv_heads: ${max:1,${floordiv:${dynamics.n_heads},8}}
    packing_factor: 2
    n_register: 8
    qk_norm_type: quest
    rope_theta: 10000.0
    time_every: 4
    mlp_ratio: 4
    dropout_rate: 0.00
    k_max: 64
    context_length: 192  # Attention window for sliding window attention
    use_bias: false
    use_rmsnorm_scale: true
    dtype: ${dtype}
    param_dtype: ${param_dtype}
    input_space: pixel
    patch_size: ${dataset.patch_size}
    image_channels: ${dataset.C}
    decoder_type: neural_field
    field_hidden_dim: 64
    field_coord_dim: 2
    field_num_freqs: 8
    field_coord_encoding: dct
    field_use_noisy_input: true
    field_row_norm: true
    field_feature_norm: true
    field_norm_eps: 1.0e-6
    field_hyper_init_std: 1.0e-3
    field_output_scale_init: 0.1

    num_binary_actions: ${dataset.num_binary_actions}
    categorical_action_dim: ${dataset.categorical_action_dim}
    continuous_action_dim: ${dataset.continuous_action_dim}

max_steps: 150_000

lr_schedule:
  schedule_type: wsd  # constant | wsd | cos
  lr: 3e-3  # constant LR or peak LR for schedules
  init_lr: 0.0
  lr_end: 0.0
  warmup_ratio: 0.05
  decay_ratio: 0.5
  max_steps: ${max_steps}

optimizer:
  optimizer_type: muon
  weight_decay: 0.0
  # AdamW params (for embeddings/biases)
  adam_lr_ratio: 1.0
  adam_b1: 0.9
  adam_b2: 0.99
  mup_scaling: false
  mup_base_dim: 512
  # Muon params (for 2D matrix weights)
  muon_beta: 0.95
  muon_ns_steps: 5
  muon_nesterov: true

write_video_every: 1000
dtype: ${dataset.dataloader_cfg.dtype}
param_dtype: bfloat16
