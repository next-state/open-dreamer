defaults:
  - common
  - dataset: minecraft_vpt_latent
  - _self_

run_name: dynamics-stable-big-latents
use_wandb: true
tokenizer_ckpt: logs/tokenizer-500M/checkpoints

ckpt:
  max_to_keep: 1
  save_interval_steps: 5_000

dataset:
  dataloader_cfg:
    B: 8
    num_workers: 0

    # Alternating batch lengths (paper: "Sequence length" paragraph)
    short_T: 64
    long_T: 64
    long_ratio: 0.1  # Fraction of batches that use long_T

dynamics:
    d_bottleneck: 16
    depth: 16
    d_model: ${mul:64,${dynamics.depth}}
    n_heads: ${floordiv:${dynamics.d_model},64}
    n_kv_heads: ${max:1,${floordiv:${dynamics.n_heads},8}}
    packing_factor: 2
    n_register: 32
    qk_norm_type: qknorm
    rope_theta: 10000.0
    time_every: 4
    time_layer_offset: 0
    mlp_ratio: 4
    dropout_rate: 0.00
    k_max: 256
    context_length: ${min:192,${dataset.dataloader_cfg.long_T}}  # Attention window for sliding window attention
    use_residual_lambdas: false
    use_bias: false
    use_rmsnorm_scale: true
    dtype: ${dtype}
    param_dtype: ${param_dtype}
    
    latent_mean: ${dataset.latent_mean}
    latent_std: ${dataset.latent_std}

    num_binary_actions: ${dataset.num_binary_actions}
    categorical_action_dim: ${dataset.categorical_action_dim}
    continuous_action_dim: ${dataset.continuous_action_dim}

ema_decay: 0.999

bootstrap_start: 200_000  # Number of start steps trained exclusively on flow-matching objective
bootstrap_fraction: 0.25  # Fraction of batch used for bootstrap samples
image_fraction: 0.0  # Fraction of batch to train as images (no temporal attention)

# Optimal transport coupling (minibatch OT)
ot:
  enabled: true
  epsilon: null
  max_iter: 50
  threshold: 1e-3
  lse_mode: true
  pairing: barycentric
  scale_cost: mean

max_steps: 200_000

lr_schedule:
  schedule_type: wsd  # constant | wsd | cos
  lr: 3e-4  # constant LR or peak LR for schedules
  init_lr: 0.0
  lr_end: 0.0
  warmup_ratio: 0.05
  decay_ratio: 0.1
  max_steps: ${max_steps}

optimizer:
  optimizer_type: laprop
  weight_decay: 0.1
  adam_b1: 0.9
  adam_b2: 0.99
  adam_eps: 1e-20
  agc_clipping: 0.3
  agc_eps: 1e-3
  mup_scaling: false

write_video_every: 10_000
