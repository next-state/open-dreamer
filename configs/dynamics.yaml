defaults:
  - common

run_name: train_dynamics
tokenizer_ckpt: ./logs/tokenizer/checkpoints
ckpt_save_every: 5e4

dataset:
  B: 64
  diversify_data: true

patch: 4
enc_n_latents: 16
enc_d_bottleneck: 32
d_model_enc: 64
d_model_dyn: 128
enc_depth: 8
dec_depth: 8
dyn_depth: 8
n_heads: 4
packing_factor: 2
n_register: 4
n_agent: 1
agent_space_mode: wm_agent_isolated

k_max: 8
bootstrap_start: 5e3
self_fraction: 0.25

max_steps: 1e9
log_every: 500
lr: 1e-4

write_video_every: 5e4