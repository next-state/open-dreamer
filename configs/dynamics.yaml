defaults:
  - common
  - dataset: minecraft_vpt_latent
  - _self_

run_name: dynamics-test
tokenizer_ckpt: logs/tokenizer-512/checkpoints/

ckpt:
  max_to_keep: 0
  save_interval_steps: 10_000

dataset:
  dataloader_cfg:
    B: 32
    T: 64
    short_T: ${short_T}
    long_T: ${long_T}
    long_ratio: ${long_batch_ratio}
  C: 16

dynamics:
    d_bottleneck: 16
    depth: 20
    d_model: ${mul:64,${dynamics.depth}}
    n_heads: ${floordiv:${dynamics.d_model},64}
    n_kv_heads: ${max:1,${floordiv:${dynamics.n_heads},8}}
    packing_factor: 2
    n_register: 32
    qk_norm_type: quest
    rope_theta: 10000.0
    time_every: 4
    mlp_ratio: 4
    dropout_rate: 0.05
    k_max: 128
    context_length: 192  # Attention window for sliding window attention
    use_residual_lambdas: true
    use_bias: false
    use_rmsnorm_scale: true
    dtype: ${dtype}
    param_dtype: ${param_dtype}
    
    latent_mean: ${dataset.latent_mean}
    latent_std: ${dataset.latent_std}

    num_binary_actions: ${dataset.num_binary_actions}
    categorical_action_dim: ${dataset.categorical_action_dim}
    continuous_action_dim: ${dataset.continuous_action_dim}

bootstrap_start: 5_000
image_fraction: 0.3  # Fraction of batch to train as images (no temporal attention)

# Alternating batch lengths (paper: "Sequence length" paragraph)
short_T: 32  # Overrides dataset.T
long_T: 32  # Overrides dataset.T
long_batch_ratio: 0.1  # Fraction of batches that use long_T

max_steps: 300_000

lr_schedule:
  schedule_type: wsd  # constant | wsd | cos
  lr: 3e-4  # constant LR or peak LR for schedules
  init_lr: 0.0
  lr_end: 0.0
  warmup_ratio: 0.167
  decay_ratio: 0.067
  max_steps: ${max_steps}

optimizer:
  optimizer_type: muon
  weight_decay: 1e-4
  # AdamW params (for embeddings/biases)
  adam_lr_ratio: 0.01
  adam_b1: 0.9
  adam_b2: 0.9
  mup_scaling: true
  mup_base_dim: 512
  # Muon params (for 2D matrix weights)
  muon_beta: 0.95
  muon_ns_steps: 5
  muon_nesterov: true

write_video_every: 5000
