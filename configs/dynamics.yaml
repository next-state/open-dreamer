defaults:
  - common
  - _self_
  - dataset: coinrun

run_name: dynamics
tokenizer_ckpt: logs/tokenizer/checkpoints/

ckpt:
  max_to_keep: 2
  save_interval_steps: 10_000

dataset:
  B: 256

dynamics:
    action_dim: 16
    d_bottleneck: 16
    depth: 12
    d_model: ${mul:64,${dynamics.depth}}
    n_heads: ${floordiv:${dynamics.d_model},64}
    n_kv_heads: ${floordiv:{dynamics.num_heads},8}
    packing_factor: 2
    n_register: 32
    qk_norm_type: quest
    rope_theta: 10000.0
    time_every: 4
    mlp_ratio: 4
    dropout_rate: 0.05
    k_max: 128
    use_residual_lambdas: true
    dtype: ${dtype}
    param_dtype: ${param_dtype}

bootstrap_start: 5_000
self_fraction: 0.25

max_steps: 300_000

lr_schedule:
  schedule_type: wsd  # constant | wsd | cos
  lr: 3e-4  # constant LR or peak LR for schedules
  init_lr: 0.0
  lr_end: 0.0
  warmup_ratio: 0.167
  decay_ratio: 0.067
  max_steps: ${max_steps}

optimizer:
  optimizer_type: muon
  weight_decay: 1e-4
  # AdamW params (for embeddings/biases)
  adam_b1: 0.9
  adam_b2: 0.9
  # Muon params (for 2D matrix weights)
  muon_beta: 0.95
  muon_ns_steps: 5
  muon_nesterov: true
  # MuP LR scaling
  mup_scaling: false
  mup_base_dim: 768

write_video_every: 5_000