defaults:
  - common
  - dataset: minecraft_vpt_latent
  - _self_

run_name: dynamics-abc
tokenizer_ckpt: logs/tokenizer-window/checkpoints/

ckpt:
  max_to_keep: 1
  save_interval_steps: 1_000

dataset:
  dataloader_cfg:
    B: 32

    # Alternating batch lengths (paper: "Sequence length" paragraph)
    short_T: 32
    long_T: 32
    long_ratio: 0.1  # Fraction of batches that use long_T

dynamics:
    d_bottleneck: 16
    depth: 16
    d_model: ${mul:64,${dynamics.depth}}
    n_heads: ${floordiv:${dynamics.d_model},64}
    n_kv_heads: ${max:1,${floordiv:${dynamics.n_heads},8}}
    packing_factor: 2
    n_register: 32
    qk_norm_type: qknorm
    rope_theta: 10000.0
    time_every: 4
    mlp_ratio: 4
    dropout_rate: 0.00
    k_max: 128
    context_length: 192  # Attention window for sliding window attention
    use_residual_lambdas: false
    use_bias: false
    use_rmsnorm_scale: true
    dtype: ${dtype}
    param_dtype: ${param_dtype}
    
    latent_mean: ${dataset.latent_mean}
    latent_std: ${dataset.latent_std}

    num_binary_actions: ${dataset.num_binary_actions}
    categorical_action_dim: ${dataset.categorical_action_dim}
    continuous_action_dim: ${dataset.continuous_action_dim}

    # Optimal transport coupling (minibatch OT)
    ot_enabled: true
    ot_epsilon: null
    ot_max_iter: 50
    ot_threshold: 1e-3
    ot_lse_mode: true
    ot_pairing: barycentric
    ot_scale_cost: mean

bootstrap_start: 50_000  # Number of start steps trained exclusively on flow-matching objective
bootstrap_fraction: 0.25  # Fraction of batch used for bootstrap samples
image_fraction: 0.3  # Fraction of batch to train as images (no temporal attention)

max_steps: 100_000

lr_schedule:
  schedule_type: wsd  # constant | wsd | cos
  lr: 3e-4  # constant LR or peak LR for schedules
  init_lr: 0.0
  lr_end: 0.0
  warmup_ratio: 0.05
  decay_ratio: 0.5
  max_steps: ${max_steps}

optimizer:
  optimizer_type: muon
  weight_decay: 0.1
  # AdamW params (for embeddings/biases)
  adam_lr_ratio: 1.0
  adam_b1: 0.9
  adam_b2: 0.99
  mup_scaling: false
  mup_base_dim: 512
  # Muon params (for 2D matrix weights)
  muon_beta: 0.95
  muon_ns_steps: 5
  muon_nesterov: true

write_video_every: 5000
dtype: ${dataset.dataloader_cfg.dtype}
param_dtype: bfloat16
