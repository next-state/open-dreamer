defaults:
    - common
    - _self_

run_name: dynamics
tokenizer_ckpt: logs/tokenizer_full_mse/checkpoints/
ckpt_save_every: 100000

# Dynamics specific
dynamics:
    d_model: 1024
    d_bottleneck: 32
    action_dim: 16
    depth: 32
    n_heads: 4
    n_kv_heads: 2
    packing_factor: 2
    n_register: 4
    qk_norm_type: Null
    rope_theta: 10000.0
    time_every: 4
    mlp_ratio: 4
    dropout_rate: 0.0
    k_max: 8
    dtype: ${dtype}
    param_dtype: ${param_dtype}

bootstrap_start: 5_000
self_fraction: 0.25
batch_size: 256

max_steps: 5_000_000
log_every: 100
lr: 1e-4

# learning rate schedule
lr_schedule: wsd  # constant | wsd | cos
init_lr: 0.0
max_lr: 1e-4
lr_end: 0
warmup_steps: 50000
wsd_decay_steps: 20000

write_video_every: 50000
