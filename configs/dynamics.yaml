defaults:
  - common
  - dataset: minecraft_vpt_latent
  - _self_

run_name: dynamics-high-lr
tokenizer_ckpt: logs/tokenizer-asymmetric/checkpoints/

ckpt:
  max_to_keep: 0
  save_interval_steps: 1_000

dataset:
  dataloader_cfg:
    B: 16
    T: 32
  C: 16

dynamics:
    d_bottleneck: 16
    depth: 16
    d_model: ${mul:64,${dynamics.depth}}
    n_heads: ${floordiv:${dynamics.d_model},64}
    n_kv_heads: ${max:1,${floordiv:${dynamics.n_heads},8}}
    packing_factor: 2
    n_register: 8
    qk_norm_type: quest
    rope_theta: 10000.0
    time_every: 4
    mlp_ratio: 4
    dropout_rate: 0.00
    k_max: 64
    context_length: 192  # Attention window for sliding window attention
    use_bias: false
    use_rmsnorm_scale: true
    dtype: ${dtype}
    param_dtype: ${param_dtype}

    num_binary_actions: ${dataset.num_binary_actions}
    categorical_action_dim: ${dataset.categorical_action_dim}
    continuous_action_dim: ${dataset.continuous_action_dim}

max_steps: 150_000

lr_schedule:
  schedule_type: wsd  # constant | wsd | cos
  lr: 1e-2  # constant LR or peak LR for schedules
  init_lr: 0.0
  lr_end: 0.0
  warmup_ratio: 0.05
  decay_ratio: 0.5
  max_steps: ${max_steps}

optimizer:
  optimizer_type: muon
  weight_decay: 0.0
  # AdamW params (for embeddings/biases)
  adam_lr_ratio: 1.0
  adam_b1: 0.9
  adam_b2: 0.99
  mup_scaling: false
  mup_base_dim: 512
  # Muon params (for 2D matrix weights)
  muon_beta: 0.95
  muon_ns_steps: 5
  muon_nesterov: true

write_video_every: 5000
dtype: ${dataset.dataloader_cfg.dtype}
param_dtype: bfloat16
