defaults:
  - common
  - dataset: minecraft_vpt_latent
  - _self_

run_name: dumo-u-fix
tokenizer_ckpt: tokenizer

ckpt:
  max_to_keep: 1
  save_interval_steps: 5_000

dataset:
  dataloader_cfg:
    B: 8
    num_workers: 16

    # Alternating batch lengths (paper: "Sequence length" paragraph)
    short_T: 64
    long_T: 64
    long_ratio: 0.1  # Fraction of batches that use long_T

dynamics:
    d_bottleneck: 16
    depth: 8
    d_model: ${mul:64,${dynamics.depth}}
    n_heads: ${floordiv:${dynamics.d_model},64}
    n_kv_heads: ${max:1,${floordiv:${dynamics.n_heads},8}}
    packing_factor: 2
    n_register: 32
    qk_norm_type: qknorm
    rope_theta: 10000.0
    time_every: 4
    time_layer_offset: 0
    mlp_ratio: 4
    dropout_rate: 0.00
    num_sampling_steps: 256  # inference-only: Euler steps for the velocity-head multi-step sampler
    context_length: ${min:192,${dataset.dataloader_cfg.long_T}}  # Attention window for sliding window attention
    use_residual_lambdas: false
    use_bias: false
    use_rmsnorm_scale: true
    dtype: ${dtype}
    param_dtype: ${param_dtype}
    
    #TODO: remove it from here and put it in the tokenizer
    latent_mean: ${dataset.latent_mean}
    latent_std: ${dataset.latent_std}

    num_binary_actions: ${dataset.num_binary_actions}
    categorical_action_dim: ${dataset.categorical_action_dim}
    continuous_action_dim: ${dataset.continuous_action_dim}

ema_decay: 0.999

max_steps: 200_000
dumo_beta: 0.7  # Weight on velocity (flow) head; flow-map (consistency) head gets (1 - dumo_beta)
image_fraction: 0.0  # Fraction of batch to train as images (no temporal attention)

# Flow-map (consistency) loss stabilisers (MeanFlow JVP runaway control)
consistency:
  correction_clip: 1.0  # clip on the (1 - sigma) * du/dsigma JVP correction
  adaptive_p: 1.0       # adaptive-weight exponent: w = 1 / (err2 + c) ** p
  adaptive_c: 1.0e-3    # adaptive-weight stabiliser constant

# Optimal transport coupling (minibatch OT)
ot:
  enabled: true
  epsilon: null
  max_iter: 50
  threshold: 1e-3
  lse_mode: true
  pairing: barycentric
  scale_cost: mean


lr_schedule:
  schedule_type: wsd  # constant | wsd | cos
  lr: 3e-4  # constant LR or peak LR for schedules
  init_lr: 0.0
  lr_end: 0.0
  warmup_ratio: 0.05
  decay_ratio: 0.1
  max_steps: ${max_steps}

optimizer:
  optimizer_type: muon
  weight_decay: 0.1
  adam_b1: 0.9
  adam_b2: 0.99
  adam_eps: 1e-8
  adam_lr_ratio: 1.0
  mup_scaling: false
  agc_clipping: 0.0
  agc_eps: 1e-3
  muon_beta: 0.99
  muon_nesterov: true
  muon_ns_steps: 5

write_video_every: 5_000
