defaults:
  - common
  - _self_

run_name: bc_rew
tokenizer_ckpt: "logs/coinrun_hard_besttk/checkpoints"
dynamics_ckpt: "logs/fixed_d_model512_n_register32_depth6_k_max64_dropout0.05_qk_normquest_rope_theta10000_n_heads8_n_kv_heads2/checkpoints"
ckpt_save_every: 100_000

dataset:
  B: 48
  T: 16
  diversify_data: true

action_dim: 16
n_agent: 4

# Training hyperparameters
bootstrap_start: 5000
self_fraction: 0.25

max_steps: 50_000
log_every: 100
write_video_every: 5000

# Learning rates
lr_policy: ${lr_dynamics}
lr_reward: ${lr_dynamics}
lr_dynamics: 1e-4

# Multi-token prediction settings
L: ${n_agent}
num_reward_bins: 101
reward_log_low: -5.0  
reward_log_high: 3.0
n_tasks: 128
use_task_ids: true

# Loss weighting
loss_weight_shortcut: 1.0
loss_weight_policy: 0.3
loss_weight_reward: 0.3