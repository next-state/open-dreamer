defaults:
  - common
  - _self_
  - dataset: coinrun

run_name: heads
tokenizer_ckpt: "logs/tokenizer/checkpoints"
dynamics_ckpt: "logs/dynamics/checkpoints"

ckpt:
  save_interval_steps: 100_000

dataset:
  B: 64
  T: 32

action_dim: 16
n_agent: 4

# Training hyperparameters
bootstrap_start: 5000
self_fraction: 0.25

max_steps: 1_000_000_000
write_video_every: 500

# Learning rate schedules
lr_schedule_policy:
  schedule_type: constant
  lr: ${lr_schedule_dynamics.lr}
  max_steps: ${max_steps}

lr_schedule_reward:
  schedule_type: constant
  lr: ${lr_schedule_dynamics.lr}
  max_steps: ${max_steps}

lr_schedule_dynamics:
  schedule_type: constant
  lr: 1e-4
  max_steps: ${max_steps}

# Optimizer config (shared across all components)
optimizer:
  optimizer_type: muon
  weight_decay: 1e-4
  # AdamW params (for embeddings/biases)
  adam_b1: 0.9
  adam_b2: 0.9
  # Muon params (for 2D matrix weights)
  muon_beta: 0.95
  muon_ns_steps: 5
  muon_nesterov: true
  # MuP LR scaling
  mup_scaling: false
  mup_base_dim: 768

dynamics_loss_weight: 0.1

# Multi-token prediction settings
L: ${n_agent}
num_reward_bins: 101
reward_log_low: -5.0
reward_log_high: 3.0
n_tasks: 128
use_task_ids: true

# Loss weighting
loss_weight_shortcut: 1.0
loss_weight_policy: 0.3
loss_weight_reward: 0.3