<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="roofline-title roofline-desc">
  <title id="roofline-title">Roofline analysis for Dreamer dynamics training on a B200 GPU</title>
  <desc id="roofline-desc">A minimal roofline chart. Throughput rises with arithmetic intensity in the bandwidth-bound region, then reaches the B200 compute ceiling at 292 FLOPs per byte. Dreamer dynamics training with 256 frames per GPU is in the compute-bound region at about 1.3 petaFLOPs per second, or 57 to 58 percent model FLOPs utilization.</desc>

  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #121212; }
      .title { font-size: 20px; font-weight: 650; }
      .axis-label { font-size: 13px; fill: #4a4f55; }
      .tick { font-size: 12px; fill: #697077; }
      .region { font-size: 15px; font-weight: 650; }
      .note { font-size: 12px; fill: #4a4f55; }
    </style>
  </defs>

  <rect width="900" height="500" fill="#ffffff"/>
  <text class="title" x="96" y="29">B200 roofline</text>

  <!-- The two regimes, kept deliberately quiet so the roofline stays primary. -->
  <path d="M96 348 L427 77 L427 400 L96 400 Z" fill="#2f7d4a" opacity="0.08"/>
  <path d="M427 77 H850 V400 H427 Z" fill="#2b6caf" opacity="0.07"/>

  <!-- Sparse guides. -->
  <g stroke="#cfd4d8" stroke-width="1">
    <line x1="96" y1="326" x2="850" y2="326"/>
    <line x1="96" y1="142" x2="850" y2="142"/>
    <line x1="96" y1="77" x2="850" y2="77"/>
  </g>

  <!-- Axes. -->
  <path d="M96 52 V400 H850" fill="none" stroke="#697077" stroke-width="1.2"/>
  <g stroke="#697077" stroke-width="1">
    <line x1="96" y1="400" x2="96" y2="406"/>
    <line x1="322" y1="400" x2="322" y2="406"/>
    <line x1="548" y1="400" x2="548" y2="406"/>
    <line x1="774" y1="400" x2="774" y2="406"/>
    <line x1="90" y1="326" x2="96" y2="326"/>
    <line x1="90" y1="142" x2="96" y2="142"/>
    <line x1="90" y1="77" x2="96" y2="77"/>
  </g>

  <g class="tick" text-anchor="middle">
    <text x="96" y="424">10</text>
    <text x="322" y="424">100</text>
    <text x="548" y="424">1,000</text>
    <text x="774" y="424">10,000</text>
  </g>
  <g class="tick" text-anchor="end">
    <text x="84" y="330">0.1</text>
    <text x="84" y="146">1</text>
    <text x="84" y="81">2.25</text>
  </g>

  <text class="axis-label" x="473" y="462" text-anchor="middle">Arithmetic intensity (FLOPs / byte moved from HBM)</text>
  <text class="axis-label" x="24" y="226" text-anchor="middle" transform="rotate(-90 24 226)">Per-GPU throughput (PFLOP/s)</text>

  <!-- B200 bandwidth slope and dense BF16 compute ceiling. -->
  <path d="M96 348 L427 77 H850" fill="none" stroke="#2b6caf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="note" x="107" y="365">7.7 TB/s HBM</text>
  <text class="note" x="838" y="67" text-anchor="end">2.25 PFLOP/s dense BF16 peak</text>

  <!-- Ridge point. -->
  <line x1="427" y1="52" x2="427" y2="400" stroke="#f07a26" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="427" cy="77" r="4" fill="#f07a26"/>
  <text x="437" y="380" font-size="12" font-weight="650" fill="#c45f1d">292 FLOP/byte</text>
  <text class="note" x="437" y="395">ridge point</text>

  <text class="region" x="190" y="253" fill="#2f7d4a">Bandwidth-bound</text>
  <text class="region" x="640" y="253" fill="#2b6caf">Compute-bound</text>

  <!-- Observed Dreamer operating point. -->
  <line x1="572" y1="151" x2="594" y2="124" stroke="#d63b76" stroke-width="1.5"/>
  <circle cx="594" cy="121" r="7" fill="#d63b76" stroke="#ffffff" stroke-width="2"/>
  <text x="566" y="166" text-anchor="end" font-size="13" font-weight="650">Dynamics model</text>
  <text class="note" x="566" y="183" text-anchor="end">256 frames / GPU</text>
  <text class="note" x="566" y="199" text-anchor="end">1.3 PFLOP/s · 57–58% MFU</text>
</svg>
